<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OOTD Daily - 今日穿搭靈感抽卡器</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes flip {
            0% { transform: rotateY(0deg) scale(1); }
            50% { transform: rotateY(90deg) scale(0.95); }
            100% { transform: rotateY(0deg) scale(1); }
        }
        .card-flip {
            animation: flip 0.5s ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col justify-between">

    <!-- 頂部導覽 -->
    <header class="py-6 text-center border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-10">
        <h1 class="text-3xl font-extrabold bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 bg-clip-text text-transparent">
            ✨ OOTD Daily 穿搭靈感抽卡器
        </h1>
        <p class="text-xs text-slate-400 mt-1">解決選衣焦慮 · 一鍵解鎖今日穿搭密碼</p>
    </header>

    <!-- 主要互動區 -->
    <main class="max-w-2xl w-full mx-auto p-4 sm:p-6 flex-grow flex flex-col items-center justify-center">
        
        <!-- 風格篩選按鈕區 -->
        <div class="flex flex-wrap justify-center gap-2 mb-6">
            <button onclick="setStyle('all')" class="style-btn px-3 py-1.5 rounded-full text-xs font-semibold bg-indigo-600 text-white shadow">全部風格</button>
            <button onclick="setStyle('City Boy')" class="style-btn px-3 py-1.5 rounded-full text-xs font-semibold bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700">City Boy</button>
            <button onclick="setStyle('日系簡約')" class="style-btn px-3 py-1.5 rounded-full text-xs font-semibold bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700">日系簡約</button>
            <button onclick="setStyle('復古 90s')" class="style-btn px-3 py-1.5 rounded-full text-xs font-semibold bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700">復古 90s</button>
            <button onclick="setStyle('Grunge')" class="style-btn px-3 py-1.5 rounded-full text-xs font-semibold bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700">Grunge</button>
        </div>

        <!-- 卡片展示區 -->
        <div id="outfitCard" class="w-full bg-slate-800/90 border border-slate-700 rounded-2xl p-6 shadow-2xl backdrop-blur relative transition-all">
            <!-- 標籤與風格 -->
            <div class="flex justify-between items-center mb-4">
                <span id="cardStyle" class="text-xs font-bold px-3 py-1 rounded-full bg-purple-900/60 text-purple-300 border border-purple-500/30">
                    City Boy
                </span>
                <span id="cardHarmony" class="text-xs text-slate-400 font-medium">
                    同色系層次搭配
                </span>
            </div>

            <!-- 色彩組合展示卡 -->
            <div class="mb-6">
                <h3 class="text-xs font-semibold text-slate-400 mb-2 uppercase tracking-wider">Color Palette / 色彩組合</h3>
                <div id="colorContainer" class="grid grid-cols-3 gap-2 h-16 rounded-xl overflow-hidden p-1 bg-slate-950/50 border border-slate-800">
                    <!-- 動態渲染色塊 -->
                </div>
            </div>

            <!-- 單品細節提案 -->
            <div class="space-y-3 bg-slate-900/60 p-4 rounded-xl border border-slate-800/80">
                <div class="flex items-center gap-3">
                    <span class="text-lg">👕</span>
                    <div>
                        <p class="text-xs text-slate-400">上衣 (Tops)</p>
                        <p id="topItem" class="text-sm font-semibold text-slate-100">寬鬆磅數口袋 T 恤</p>
                    </div>
                </div>
                <div class="flex items-center gap-3 border-t border-slate-800/60 pt-2">
                    <span class="text-lg">👖</span>
                    <div>
                        <p class="text-xs text-slate-400">下身 (Bottoms)</p>
                        <p id="bottomItem" class="text-sm font-semibold text-slate-100">深藍直筒寬版西裝褲</p>
                    </div>
                </div>
                <div class="flex items-center gap-3 border-t border-slate-800/60 pt-2">
                    <span class="text-lg">👟</span>
                    <div>
                        <p class="text-xs text-slate-400">鞋履與配件 (Shoes & Accessories)</p>
                        <p id="shoeItem" class="text-sm font-semibold text-slate-100">經典復古復刻板鞋 + 低調棒球帽</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 操作按鈕 -->
        <button onclick="drawCard()" class="mt-8 px-8 py-3.5 bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 text-white font-bold rounded-xl shadow-lg hover:shadow-purple-500/25 active:scale-95 transition-all w-full sm:w-auto text-base">
            🎲 抽取今日穿搭靈感
        </button>

    </main>

    <!-- 頁尾 -->
    <footer class="text-center py-4 text-xs text-slate-500 border-t border-slate-800/80">
        &copy; 2026 OOTD Daily. Designed with Vibe Coding.
    </footer>

    <!-- 邏輯腳本 -->
    <script>
        // 穿搭資料庫
        const db = [
            {
                style: "City Boy",
                harmony: "同色系藍調層次",
                colors: [{ name: "霧藍", hex: "#4A6FA5" }, { name: "藏青", hex: "#1B263B" }, { name: "純白", hex: "#F8F9FA" }],
                top: "過肩寬鬆 Oxford 藍襯衫（內搭白 Tee）",
                bottom: "深藍直筒寬版卡其褲",
                shoes: "灰色復古慢跑鞋 + 長襪"
            },
            {
                style: "日系簡約",
                harmony: "大地色系（Earth Tone）",
                colors: [{ name: "燕麥", hex: "#E0D5C1" }, { name: "橄欖綠", hex: "#556B2F" }, { name: "米白", hex: "#F5F5DC" }],
                top: "米色針織五分袖衫",
                bottom: "橄欖綠寬版打褶錐形褲",
                shoes: "黑色皮革帆船鞋 / 涼鞋"
            },
            {
                style: "復古 90s",
                harmony: "經典高對比色搭配",
                colors: [{ name: "丹寧藍", hex: "#3B5998" }, { name: "芥末黃", hex: "#E1AD01" }, { name: "水洗黑", hex: "#2B2B2B" }],
                top: "水洗復古印花短 Tee",
                bottom: "中淺色直筒水洗牛仔褲",
                shoes: "高筒帆布鞋 + 金屬鏈條飾品"
            },
            {
                style: "Grunge",
                harmony: "暗色調與視覺撞色",
                colors: [{ name: "炭黑", hex: "#1C1C1C" }, { name: "深紅格紋", hex: "#8B0000" }, { name: "軍綠", hex: "#4B5320" }],
                top: "寬鬆黑紅格紋長袖襯衫（外罩/內搭搭破洞 Tee）",
                bottom: "黑色微寬鬆破洞牛仔褲",
                shoes: "馬汀 8 孔靴 / 厚底黑色球鞋"
            },
            {
                style: "City Boy",
                harmony: "對比撞色活力搭配",
                colors: [{ name: "亮橘", hex: "#FF5722" }, { name: "深灰", hex: "#37474F" }, { name: "淺灰", hex: "#CFD8DC" }],
                top: "亮橘色連帽 Sweatshirt",
                bottom: "深灰防刮軍裝工裝褲",
                shoes: "復古籃球鞋 + 刺繡棒球帽"
            }
        ];

        let currentStyle = 'all';

        function setStyle(style) {
            currentStyle = style;
            drawCard();
        }

        function drawCard() {
            const cardElement = document.getElementById('outfitCard');
            cardElement.classList.add('card-flip');

            setTimeout(() => {
                // 依據風格過濾
                const filtered = currentStyle === 'all' 
                    ? db 
                    : db.filter(item => item.style === currentStyle);
                
                // 隨機選取
                const randomItem = filtered[Math.floor(Math.random() * filtered.length)];

                // 更新 DOM
                document.getElementById('cardStyle').innerText = randomItem.style;
                document.getElementById('cardHarmony').innerText = randomItem.harmony;
                document.getElementById('topItem').innerText = randomItem.top;
                document.getElementById('bottomItem').innerText = randomItem.bottom;
                document.getElementById('shoeItem').innerText = randomItem.shoes;

                // 渲染色塊
                const colorContainer = document.getElementById('colorContainer');
                colorContainer.innerHTML = randomItem.colors.map(c => `
                    <div class="h-full rounded-lg flex flex-col justify-end p-1.5 text-[10px] font-bold shadow-inner transition-transform hover:scale-105" style="background-color: ${c.hex}">
                        <span class="bg-black/40 backdrop-blur px-1 py-0.5 rounded text-white text-center">${c.name}</span>
                    </div>
                `).join('');

            }, 250);

            setTimeout(() => {
                cardElement.classList.remove('card-flip');
            }, 500);
        }

        // 初始化第一次抽卡
        drawCard();
    </script>
</body>
</html>
